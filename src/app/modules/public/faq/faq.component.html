<!-- Hero Section with Breadcrumbs -->
<section class="relative py-20 lg:py-28 bg-gradient-to-br from-primary-600 via-primary-700 to-primary-900 text-white overflow-hidden">
  <div class="absolute inset-0 pointer-events-none">
    <div class="absolute -right-20 top-20 w-64 h-64 bg-primary-400/20 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute left-1/4 top-1/3 w-80 h-80 bg-teal-400/20 rounded-full blur-3xl animate-pulse delay-1000"></div>
  </div>
  
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center">
    <h1 class="text-3xl md:text-5xl font-extrabold mb-4">Frequently Asked Questions</h1>
    <p class="text-primary-100 max-w-2xl mx-auto mb-6 text-lg">
      Everything you need to know about our modern banking platform and services.
    </p>
    <div class="flex justify-center items-center space-x-2 text-sm text-primary-200">
      <a routerLink="/" class="hover:text-white transition-colors">Home</a>
      <i class="fa-solid fa-chevron-right text-xs"></i>
      <span class="text-white font-semibold">FAQ</span>
    </div>
  </div>
</section>

<!-- FAQ Content Section -->
<section class="py-16 bg-white dark:bg-gray-900 min-h-[600px]">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Category Tabs -->
    <div class="flex flex-wrap justify-center gap-3 mb-12">
      <button (click)="setCategory('about')" 
              [class]="activeCategory === 'about' ? 'bg-primary-600 text-white shadow-lg shadow-primary-500/30' : 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200'"
              class="px-5 py-2.5 rounded-full font-semibold text-sm transition-all">
        About {{ siteName }}
      </button>
      <button (click)="setCategory('account')" 
              [class]="activeCategory === 'account' ? 'bg-primary-600 text-white shadow-lg shadow-primary-500/30' : 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200'"
              class="px-5 py-2.5 rounded-full font-semibold text-sm transition-all">
        My Account & KYC
      </button>
      <button (click)="setCategory('deposit')" 
              [class]="activeCategory === 'deposit' ? 'bg-primary-600 text-white shadow-lg shadow-primary-500/30' : 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200'"
              class="px-5 py-2.5 rounded-full font-semibold text-sm transition-all">
        Deposits
      </button>
      <button (click)="setCategory('withdrawal')" 
              [class]="activeCategory === 'withdrawal' ? 'bg-primary-600 text-white shadow-lg shadow-primary-500/30' : 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200'"
              class="px-5 py-2.5 rounded-full font-semibold text-sm transition-all">
        Transfers & Withdrawals
      </button>
    </div>

    <!-- FAQ Accordion List -->
    <div class="space-y-4">
      <div *ngFor="let item of faqs[activeCategory]" 
           class="bg-gray-50 dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 overflow-hidden transition-all shadow-sm">
        <button (click)="toggleFaq(item)" 
                class="w-full px-6 py-5 flex justify-between items-center text-left text-gray-900 dark:text-white font-bold text-lg hover:text-primary-600 dark:hover:text-primary-400 transition-colors">
          <span>{{ item.question }}</span>
          <i class="fa-solid fa-chevron-down text-sm transition-transform duration-300" [ngClass]="{'rotate-180': item.open}"></i>
        </button>
        <div *ngIf="item.open" class="px-6 pb-6 text-gray-600 dark:text-gray-300 leading-relaxed border-t border-gray-200/50 dark:border-gray-700/50 pt-4 animate-fadeIn">
          {{ item.answer }}
        </div>
      </div>
    </div>

    <!-- Need More Help Card -->
    <div class="mt-16 bg-gradient-to-r from-primary-500 to-primary-700 rounded-2xl p-8 text-white text-center shadow-xl">
      <h3 class="text-2xl font-bold mb-2">Still have questions?</h3>
      <p class="text-primary-100 mb-6 max-w-md mx-auto">We are here to assist you 24 hours a day, 7 days a week with personalized member care.</p>
      <a routerLink="/contact" class="inline-flex items-center px-6 py-3 bg-white text-primary-700 font-bold rounded-xl shadow-lg hover:bg-primary-50 transition-colors">
        <i class="fa-solid fa-headset mr-2"></i> Contact Customer Support
      </a>
    </div>
  </div>
</section>
