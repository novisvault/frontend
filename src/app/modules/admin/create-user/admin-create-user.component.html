<div class="max-w-4xl mx-auto space-y-6">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">
        Create A New User
      </h1>
      <p class="text-xs sm:text-sm text-slate-400 mt-0.5">
        Provision a verified banking client account with pre-assigned balance and authorization security keys.
      </p>
    </div>
    <a routerLink="/admin/users" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition-colors flex items-center space-x-1.5">
      <i class="fa fa-arrow-left"></i>
      <span>Back to Users</span>
    </a>
  </div>

  <!-- Alert messages -->
  <div *ngIf="errorMessage" class="p-4 rounded-2xl bg-red-950/80 border border-red-800 text-red-300 text-xs font-bold">
    <i class="fa fa-triangle-exclamation mr-2"></i> {{ errorMessage }}
  </div>
  <div *ngIf="successMessage" class="p-4 rounded-2xl bg-emerald-950/80 border border-emerald-800 text-emerald-300 text-xs font-bold">
    <i class="fa fa-circle-check mr-2"></i> {{ successMessage }}
  </div>

  <!-- Form Card Matching createnewuser.blade.php -->
  <div class="bg-slate-900/90 rounded-3xl border border-slate-800 shadow-2xl p-6 sm:p-8">
    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xxs font-bold uppercase tracking-wider text-slate-400 mb-1.5">First Name *</label>
          <input type="text" [(ngModel)]="name" name="name" required placeholder="First name" class="w-full rounded-xl bg-slate-950 border border-slate-800 px-4 py-2.5 text-xs text-white focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xxs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Middle Name</label>
          <input type="text" [(ngModel)]="middlename" name="middlename" placeholder="Middle name" class="w-full rounded-xl bg-slate-950 border border-slate-800 px-4 py-2.5 text-xs text-white focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xxs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Last Name *</label>
          <input type="text" [(ngModel)]="lastname" name="lastname" required placeholder="Last name" class="w-full rounded-xl bg-slate-950 border border-slate-800 px-4 py-2.5 text-xs text-white focus:border-blue-500">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xxs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Username</label>
          <input type="text" [(ngModel)]="username" name="username" placeholder="Username (optional)" class="w-full rounded-xl bg-slate-950 border border-slate-800 px-4 py-2.5 text-xs text-white focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xxs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Email Address *</label>
          <input type="email" [(ngModel)]="email" name="email" required placeholder="client@example.com" class="w-full rounded-xl bg-slate-950 border border-slate-800 px-4 py-2.5 text-xs text-white focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xxs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Phone Number</label>
          <input type="text" [(ngModel)]="phone" name="phone" placeholder="+1 (555) 000-0000" class="w-full rounded-xl bg-slate-950 border border-slate-800 px-4 py-2.5 text-xs text-white focus:border-blue-500">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xxs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Date of Birth</label>
          <input type="date" [(ngModel)]="dob" name="dob" class="w-full rounded-xl bg-slate-950 border border-slate-800 px-4 py-2.5 text-xs text-white focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xxs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Nationality / Jurisdiction</label>
          <select [(ngModel)]="country" name="country" class="w-full rounded-xl bg-slate-950 border border-slate-800 px-4 py-2.5 text-xs text-white focus:border-blue-500">
            <option *ngFor="let c of countries" [value]="c">{{ c }}</option>
          </select>
        </div>
        <div>
          <label class="block text-xxs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Residential Address</label>
          <input type="text" [(ngModel)]="address" name="address" placeholder="Residential Street Address" class="w-full rounded-xl bg-slate-950 border border-slate-800 px-4 py-2.5 text-xs text-white focus:border-blue-500">
        </div>
      </div>

      <!-- Account Classification & Balance -->
      <div class="p-4 rounded-2xl bg-slate-950/60 border border-slate-800 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xxs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Account Type</label>
          <select [(ngModel)]="accounttype" name="accounttype" class="w-full rounded-xl bg-slate-900 border border-slate-700 px-4 py-2.5 text-xs text-white focus:border-blue-500">
            <option *ngFor="let t of accountTypes" [value]="t">{{ t }}</option>
          </select>
        </div>
        <div>
          <label class="block text-xxs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Assigned Account Number</label>
          <input type="text" [(ngModel)]="usernumber" name="usernumber" class="w-full rounded-xl bg-slate-900 border border-slate-700 px-4 py-2.5 font-mono font-bold text-amber-300 text-xs">
        </div>
        <div>
          <label class="block text-xxs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Initial Account Balance ($ USD)</label>
          <input type="number" [(ngModel)]="balance" name="balance" step="0.01" min="0" placeholder="0.00" class="w-full rounded-xl bg-slate-900 border border-slate-700 px-4 py-2.5 font-mono font-bold text-emerald-400 text-xs">
        </div>
      </div>

      <!-- Security Codes & PIN matching createnewuser.blade.php lines 110-129 -->
      <div class="p-4 rounded-2xl bg-slate-950/60 border border-slate-800 space-y-3">
        <h4 class="text-xs font-black uppercase tracking-wider text-slate-400">Clearance Codes & Transaction Security PIN</h4>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
          <div>
            <label class="block text-xxs font-bold text-slate-400 mb-1">Code 1 (COT)</label>
            <input type="text" [(ngModel)]="code1" name="code1" class="w-full rounded-xl bg-slate-900 border border-slate-700 px-3 py-2 font-mono text-amber-300 text-xs">
          </div>
          <div>
            <label class="block text-xxs font-bold text-slate-400 mb-1">Code 2 (Tax)</label>
            <input type="text" [(ngModel)]="code2" name="code2" class="w-full rounded-xl bg-slate-900 border border-slate-700 px-3 py-2 font-mono text-amber-300 text-xs">
          </div>
          <div>
            <label class="block text-xxs font-bold text-slate-400 mb-1">Code 3 (IMF)</label>
            <input type="text" [(ngModel)]="code3" name="code3" class="w-full rounded-xl bg-slate-900 border border-slate-700 px-3 py-2 font-mono text-amber-300 text-xs">
          </div>
          <div>
            <label class="block text-xxs font-bold text-slate-400 mb-1">Code 4 (ATC)</label>
            <input type="text" [(ngModel)]="code4" name="code4" class="w-full rounded-xl bg-slate-900 border border-slate-700 px-3 py-2 font-mono text-amber-300 text-xs">
          </div>
          <div>
            <label class="block text-xxs font-bold text-slate-400 mb-1">Code 5 (AML)</label>
            <input type="text" [(ngModel)]="code5" name="code5" class="w-full rounded-xl bg-slate-900 border border-slate-700 px-3 py-2 font-mono text-amber-300 text-xs">
          </div>
          <div>
            <label class="block text-xxs font-bold text-slate-400 mb-1">4-Digit PIN</label>
            <input type="text" [(ngModel)]="pin" name="pin" maxlength="4" class="w-full rounded-xl bg-slate-900 border border-slate-700 px-3 py-2 font-mono font-bold text-rose-400 text-xs">
          </div>
        </div>
      </div>

      <!-- Password Credentials -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xxs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Account Password *</label>
          <input type="password" [(ngModel)]="password" name="password" required placeholder="Choose secure password" class="w-full rounded-xl bg-slate-950 border border-slate-800 px-4 py-2.5 text-xs text-white focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xxs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Confirm Password *</label>
          <input type="password" [(ngModel)]="password_confirmation" name="password_confirmation" required placeholder="Confirm password" class="w-full rounded-xl bg-slate-950 border border-slate-800 px-4 py-2.5 text-xs text-white focus:border-blue-500">
        </div>
      </div>

      <!-- Submit Button -->
      <div class="pt-4 flex justify-end">
        <button type="submit" [disabled]="loading" class="px-8 py-3 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-black text-xs shadow-xl shadow-blue-600/30 transition-all flex items-center space-x-2">
          <i class="fa fa-spinner fa-spin" *ngIf="loading"></i>
          <span>Add User to Institutional Registry</span>
        </button>
      </div>
    </form>
  </div>
</div>
