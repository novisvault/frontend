<!-- Header Section -->
<div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
  <div>
    <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
      Transaction & Statement Generator
    </h1>
    <p class="text-xs sm:text-sm text-gray-400 mt-0.5">
      Synthesize authentic transaction histories across custom date ranges for client bank statements.
    </p>
  </div>
</div>

<div class="max-w-3xl mx-auto">
  <div class="bg-gray-900 rounded-3xl border border-gray-800 shadow-2xl overflow-hidden p-6 sm:p-8">
    <div class="flex items-center space-x-3 pb-6 border-b border-gray-800 mb-6">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-red-600 to-rose-600 text-white flex items-center justify-center shadow-lg shadow-red-500/30">
        <i class="fa-solid fa-wand-magic-sparkles text-base"></i>
      </div>
      <div>
        <h3 class="text-base font-bold text-white">Generation Parameters</h3>
        <p class="text-xs text-gray-400">Specify volume, date bounds, and amount boundaries</p>
      </div>
    </div>

    <!-- Alert Message -->
    <div *ngIf="message" class="mb-6 p-4 rounded-2xl text-xs font-semibold flex items-center space-x-3" [class.bg-green-950]="isSuccess" [class.border]="true" [class.border-green-800]="isSuccess" [class.text-green-300]="isSuccess" [class.bg-red-950]="!isSuccess" [class.border-red-800]="!isSuccess" [class.text-red-300]="!isSuccess">
      <i class="fa-solid text-base" [class.fa-check-circle]="isSuccess" [class.fa-circle-exclamation]="!isSuccess"></i>
      <span>{{ message }}</span>
    </div>

    <form (ngSubmit)="generate()" class="space-y-5">
      <!-- Target User -->
      <div>
        <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">
          Target Client Account <span class="text-red-500">*</span>
        </label>
        <select [(ngModel)]="selectedUserId" name="selectedUserId" class="block w-full rounded-2xl border-gray-800 bg-gray-950 px-4 py-3.5 text-xs font-bold text-white focus:border-red-500 focus:ring-red-500" required>
          <option *ngFor="let u of users" [value]="u.id">
            {{ u.name }} (Acct: {{ u.account_number }}) - ${{ u.account_bal | number:'1.2-2' }}
          </option>
        </select>
      </div>

      <!-- Count & Type -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">
            Number of Transactions (1 - 50)
          </label>
          <input type="number" [(ngModel)]="numTransactions" name="numTransactions" min="1" max="50" class="block w-full rounded-2xl border-gray-800 bg-gray-950 px-4 py-3 text-sm font-mono font-bold text-white focus:border-red-500 focus:ring-red-500" required>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">
            Transaction Flow Type
          </label>
          <select [(ngModel)]="transactionType" name="transactionType" class="block w-full rounded-2xl border-gray-800 bg-gray-950 px-4 py-3 text-xs font-bold text-white focus:border-red-500 focus:ring-red-500">
            <option value="Credit">Credit (Deposit / Inward Wire / Interest)</option>
            <option value="Debit">Debit (Withdrawal / Outward Wire / Settlement)</option>
          </select>
        </div>
      </div>

      <!-- Min & Max Amounts -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">
            Minimum Amount ($ USD)
          </label>
          <input type="number" [(ngModel)]="minAmount" name="minAmount" min="10" step="10" class="block w-full rounded-2xl border-gray-800 bg-gray-950 px-4 py-3 text-sm font-mono text-white focus:border-red-500 focus:ring-red-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">
            Maximum Amount ($ USD)
          </label>
          <input type="number" [(ngModel)]="maxAmount" name="maxAmount" min="50" step="50" class="block w-full rounded-2xl border-gray-800 bg-gray-950 px-4 py-3 text-sm font-mono text-white focus:border-red-500 focus:ring-red-500">
        </div>
      </div>

      <!-- Dates -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">
            Earliest Timestamp
          </label>
          <input type="date" [(ngModel)]="startDate" name="startDate" class="block w-full rounded-2xl border-gray-800 bg-gray-950 px-4 py-3 text-sm text-white focus:border-red-500 focus:ring-red-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">
            Latest Timestamp
          </label>
          <input type="date" [(ngModel)]="endDate" name="endDate" class="block w-full rounded-2xl border-gray-800 bg-gray-950 px-4 py-3 text-sm text-white focus:border-red-500 focus:ring-red-500">
        </div>
      </div>

      <div class="pt-4 border-t border-gray-800">
        <button type="submit" [disabled]="loading" class="w-full py-4 rounded-2xl bg-gradient-to-r from-red-600 to-rose-600 text-white font-bold text-xs uppercase tracking-wider shadow-xl shadow-red-600/30 hover:from-red-700 transition-all disabled:opacity-50 flex items-center justify-center space-x-2">
          <span *ngIf="loading" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          <i *ngIf="!loading" class="fa-solid fa-bolt"></i>
          <span>Execute Transaction Generation Batch</span>
        </button>
      </div>
    </form>
  </div>
</div>
