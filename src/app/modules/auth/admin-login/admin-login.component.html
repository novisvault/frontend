<div class="min-h-screen bg-gray-950 flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
  <!-- Glowing Background Grid Accent -->
  <div class="absolute inset-0 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:16px_16px] opacity-40 pointer-events-none"></div>
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-red-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="relative z-10 sm:mx-auto sm:w-full sm:max-w-md">
    <!-- Header Logo & Identity -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-red-600 to-rose-600 text-white shadow-xl shadow-red-600/30 mb-4 border border-red-500/30">
        <i class="fa-solid fa-user-shield text-2xl"></i>
      </div>
      <h2 class="text-2xl font-black text-white tracking-tight">
        BankProX Admin Portal
      </h2>
      <p class="text-xs uppercase font-extrabold tracking-widest text-red-500 mt-1">
        Authorized Terminal Access Only
      </p>
    </div>

    <!-- Login Card -->
    <div class="bg-gray-900 rounded-3xl p-8 border border-gray-800 shadow-2xl relative">
      <!-- Error Feedback -->
      <div *ngIf="errorMessage" class="mb-6 p-4 rounded-2xl bg-red-950/60 border border-red-800/80 text-red-400 text-xs font-semibold flex items-center space-x-3">
        <i class="fa-solid fa-circle-exclamation text-base shrink-0"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">
            Master Admin Email
          </label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
              <i class="fa-solid fa-envelope text-xs"></i>
            </span>
            <input type="email" [(ngModel)]="email" name="email" class="w-full pl-10 pr-4 py-3.5 bg-gray-950 border border-gray-800 rounded-2xl text-xs sm:text-sm font-bold text-white placeholder-gray-600 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all" placeholder="admin@admin.com" required autofocus>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">
            Master Password
          </label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
              <i class="fa-solid fa-key text-xs"></i>
            </span>
            <input type="password" [(ngModel)]="password" name="password" class="w-full pl-10 pr-4 py-3.5 bg-gray-950 border border-gray-800 rounded-2xl text-xs sm:text-sm font-bold text-white placeholder-gray-600 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all" placeholder="••••••••••••" required>
          </div>
        </div>

        <button type="submit" [disabled]="loading" class="w-full py-4 rounded-2xl bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-black text-xs sm:text-sm uppercase tracking-wider shadow-xl shadow-red-600/30 transition-all flex items-center justify-center space-x-2 disabled:opacity-50 mt-6 cursor-pointer">
          <i *ngIf="loading" class="fa-solid fa-circle-notch fa-spin"></i>
          <i *ngIf="!loading" class="fa-solid fa-lock"></i>
          <span>{{ loading ? 'Verifying Credentials...' : 'Elevate To Admin Console' }}</span>
        </button>
      </form>

      <div class="text-center mt-6 pt-6 border-t border-gray-800/80">
        <a routerLink="/auth/login" class="text-xs text-gray-400 hover:text-white transition-colors inline-flex items-center space-x-1.5">
          <i class="fa-solid fa-arrow-left text-xxs"></i>
          <span>Return to Client Banking</span>
        </a>
      </div>
    </div>
  </div>
</div>
